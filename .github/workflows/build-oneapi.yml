name: Build with oneAPI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-4-dev \
            libfreetype6-dev libavutil-dev libavcodec-dev libavformat-dev \
            libswscale-dev zlib1g-dev clang meson

      - name: Install newer Pango from source
        run: |
          # Download and build Pango 1.57+
          wget https://download.gnome.org/sources/pango/1.57/pango-1.57.0.tar.xz
          tar xf pango-1.57.0.tar.xz
          cd pango-1.57.0
          meson setup build --prefix=/usr/local
          ninja -C build
          sudo ninja -C build install
          cd ..

      - name: Build editor-gtk
        run: |
          export CARGO_BUILD_JOBS=4
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig
          cargo build -p shrimply-editor-gtk --release
        env:
          RUST_BACKTRACE: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shrimply-editor-linux
          path: target/release/shrimply-editor
